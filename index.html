<script>
const DATA=[{"id": 1, "name": "The Kracked Egg", "meal": "朝食", "menu": "エッグベネディクト（スモークサーモン）／SOS Local Motion／ホットケーキメドレー／トロピカルディライト", "price": "$10〜16", "area": "Tumon / Tamuning", "lat": 13.5147, "lng": -144.8048, "maps": "https://www.google.com/maps/search/?api=1&query=The+Kracked+Egg+Guam", "official": "https://www.thekrackedegg.com/", "emoji": "🥚", "comment": "🌅 朝食の王道。Lox Florentineはスモークサーモン＋ほうれん草＋ポーチドエッグ＋オランデーズをイングリッシュマフィンに重ねたエッグベネディクト。塩気のあるサーモンと半熟卵、濃厚ソースの相性がよく、アメリカンブレックファストを楽しみたい日におすすめ。Hot Cake Medleyは3種類選べて家族でシェアしやすい。", "image": "https://amurublog.com/wp-content/uploads/2020/05/IM-GUAM2072-730x410.jpg"}, {"id": 2, "name": "Little Pika's", "meal": "朝食", "menu": "チャモロソーセージベネディクト／ロコモコ／カルーアフレンチトースト", "price": "$12〜17", "area": "Tumon", "lat": 13.5155, "lng": -144.8056, "maps": "https://www.google.com/maps/search/?api=1&query=Little+Pika%27s+Guam", "official": "https://www.pikascafeguam.com/", "emoji": "🍳", "comment": "🌅 Chamorroソーセージのベネディクトは、香ばしいソーセージ＋半熟卵＋オランデーズのローカル感ある朝食。ロコモコならご飯＋ハンバーグ＋グレービー＋卵でボリューム満点。キッズメニューもあり、家族旅行との相性が◎。", "image": "https://ak-d.tripcdn.com/images/1mi3n224x8xibqqy701E8.jpg?proc=source%2Ftrip"}, {"id": 3, "name": "Shirley's Restaurant", "meal": "朝食", "menu": "コーンドビーフハッシュ＋ポルトガルソーセージ＋卵／クラブサンド／スパイシースパムフライドライス", "price": "$10〜20", "area": "Apotgan", "lat": 13.4925, "lng": -144.7988, "maps": "https://www.google.com/maps/search/?api=1&query=Shirley%27s+Restaurant+Guam", "official": "https://www.facebook.com/shirleystamuning/", "emoji": "🍳", "comment": "🍳 グアムの家庭料理系ファミレス。コーンビーフハッシュは牛肉とポテトを香ばしく焼いて卵と合わせる定番。チャモロソーセージやガーリック系フライドライスもあり、ローカル食堂っぽい朝ごはんを食べたい人向け。", "image": ""}, {"id": 4, "name": "King's Restaurants", "meal": "朝食", "menu": "ロコモコ／カドンピカ／パンケーキ／フライドライス", "price": "$10〜20", "area": "Harmon", "lat": 13.522, "lng": -144.8225, "maps": "https://www.google.com/maps/search/?api=1&query=King%27s+Restaurants+Guam", "official": "", "emoji": "🍳", "comment": "🍳 ロコモコは白ご飯＋ハンバーグ＋グレービー＋目玉焼きの太平洋エリア定番。肉＋ご飯＋卵で満足感が高く、朝からしっかり食べたい日にぴったり。パンケーキやフライドライスも家族で選びやすい。", "image": "https://fs.tour.ne.jp/index.php/file_manage/disp_file/?fid=review%2F629%2F201911%2F14f49b55c5f5307cf5dba1100b84785c.jpg&w=1080"}, {"id": 5, "name": "Jack in the Box", "meal": "ランチ", "menu": "マンチーミール／Sourdough Jack／Classic Buttery Jack／カーリーフライ／タコス", "price": "$10〜20", "area": "Tamuning", "lat": 13.505, "lng": -144.806, "maps": "https://www.google.com/maps/search/?api=1&query=Jack+in+the+Box+Guam", "official": "https://www.jackinthebox.com/", "emoji": "🍔", "comment": "🍔 Sourdough Jackは香ばしいサワードウにビーフパティ、ベーコン、チーズ、トマトなどを合わせた看板系バーガー。カーリーフライやタコスも一緒に頼めるのでシェアしやすく、24時間営業の店舗は夜食候補にも便利。", "image": "https://www.mashed.com/img/gallery/43-fast-food-items-you-need-to-eat-before-you-die/jack-in-the-boxs-sourdough-jack-1653333422.jpg"}, {"id": 6, "name": "Panda Express", "meal": "ランチ", "menu": "オレンジチキン／ハニーセサミチキン／北京牛肉／ハニーウォルナッツシュリンプ／チャーハン", "price": "$10〜20", "area": "Hagåtña", "lat": 13.4748, "lng": -144.751, "maps": "https://www.google.com/maps/search/?api=1&query=Panda+Express+Guam", "official": "https://www.pandaexpress.com/", "emoji": "🍊", "comment": "🍊 オレンジチキンはカリッと揚げた鶏肉に甘酸っぱく濃いめのオレンジソースを絡めた定番。北京牛肉やチャーハンと組み合わせてプレートにでき、家族で好みが分かれても選びやすい。", "image": "https://img.p.mapq.st/?q=75&url=https%3A%2F%2Fs3-media0.fl.yelpcdn.com%2Fbphoto%2FWgxqj-NdNblnPf4m-AzLOA%2Fl.jpg&w=3840"}, {"id": 7, "name": "Jollibee", "meal": "ランチ", "menu": "Chickenjoy／Jollyスパゲティ／グレイビーハンバーグ", "price": "$10〜20", "area": "Liguan", "lat": 13.482, "lng": -144.824, "maps": "https://www.google.com/maps/search/?api=1&query=Jollibee+Guam", "official": "https://www.jollibeeusa.com/", "emoji": "🍗", "comment": "🍗 Chickenjoyは衣がカリッとしたフライドチキンを濃厚グレービーにつけて食べるフィリピン発の看板。Jollyスパゲティは甘めのソースが特徴で子どもにも選びやすく、Peach Mango Pieまで含めて日本では少し珍しい味を楽しめる。", "image": "https://assets.simpleviewinc.com/sv-guam/image/upload/c_fill%2Ch_600%2Cq_75%2Cw_800/v1/cms_resources/clients/guam/jol_6_a83d8779-dc4f-459e-a238-dc2d086b0003.jpg"}, {"id": 8, "name": "Meskla Dos（Upper Tumon）", "meal": "ランチ", "menu": "Shrimp “Uhang” Burger／ファイヤークラッカースパイスバーガー／スイートポテトフライ", "price": "$12〜19", "area": "Upper Tumon", "lat": 13.524, "lng": -144.81, "maps": "https://www.google.com/maps/search/?api=1&query=Meskla+Dos+Upper+Tumon+Guam", "official": "https://mesklaguam.com/", "emoji": "🍔", "comment": "🍔 Uhang Burgerはエビのパティをパン粉で揚げ、タルタル系ソースで仕上げた名物級バーガー。普通のビーフバーガーとは違う、グアムらしいシーフード系バーガーを食べたいならここ。", "image": "https://tblg.k-img.com/restaurant/images/Rvw/56986/640x640_rect_56986086.jpg"}, {"id": 9, "name": "Meskla Dos（Lower Tumon）", "meal": "ランチ", "menu": "Shrimp “Uhang” Burger＋スパイシーマヨ／チキンストリップ／ビーフ＆ボーンレスポークリブ", "price": "$12〜19", "area": "Lower Tumon", "lat": 13.51, "lng": -144.805, "maps": "https://www.google.com/maps/search/?api=1&query=Meskla+Dos+Lower+Tumon+Guam", "official": "https://mesklaguam.com/", "emoji": "🍔", "comment": "🍔 Shrimp Uhang Burgerはエビの旨味と揚げた香ばしさが主役。スイートポテトフライを合わせると甘じょっぱい組み合わせになり、シェアにも向く。ローカル食材を現代的なバーガーにした一品。", "image": "https://tblg.k-img.com/restaurant/images/Rvw/56986/640x640_rect_56986086.jpg"}, {"id": 10, "name": "Hambros", "meal": "ランチ", "menu": "ベーコンチーズバーガー／シュリンプサラダ＋クアトロコンボ／オニオンリング", "price": "$10〜20", "area": "Tumon", "lat": 13.513, "lng": -144.8065, "maps": "https://www.google.com/maps/search/?api=1&query=Hambros+Guam", "official": "", "emoji": "🍔", "comment": "🍔 肉厚パティのボリューム系バーガーが中心。ベーコンチーズバーガーは肉＋チーズ＋ベーコンの王道で、オニオンリングを添えるとアメリカン感がさらにアップ。タモン中心から歩いて寄りやすいのも魅力。", "image": ""}, {"id": 11, "name": "FujiIchiban Guam", "meal": "ランチ", "menu": "醤油・豚骨ラーメン／辛辛スパイシーラーメン／唐揚げ／チャーハン", "price": "$10〜20", "area": "Tumon", "lat": 13.512, "lng": -144.8068, "maps": "https://www.google.com/maps/search/?api=1&query=FujiIchiban+Guam", "official": "https://fujiichiguam.com/", "emoji": "🍜", "comment": "🍜 味噌・醤油・豚骨系ラーメンにチャーシュー、味玉、ねぎなどを合わせる日本食。グアム料理が続いて日本食が恋しくなった時にも便利。唐揚げやチャーハンを追加して家族でシェアするのもおすすめ。", "image": "https://image.jimcdn.com/app/cms/image/transf/none/path/sf9e43b9122b4e5ae/image/i2c64dcccaf962d21/version/1683441518/image.jpg"}, {"id": 12, "name": "Sakura Dining", "meal": "ランチ", "menu": "梅鉄板セット／寿司／刺身／天ぷら", "price": "$10〜20", "area": "Tamuning", "lat": 13.492, "lng": -144.8, "maps": "https://www.google.com/maps/search/?api=1&query=Sakura+Dining+Guam", "official": "https://sakuraguam.com/", "emoji": "🍣", "comment": "🍣 寿司・刺身・天ぷらなど、日本食をしっかり食べたい日に向く店。寿司プラッターなら複数種類をまとめて楽しめ、家族で取り分けやすい。グアム料理が続いた日の日本食リセットにも。", "image": "https://cdn.myordering.online/biteheist-uploads/restaurant/1763656220140.webp"}, {"id": 13, "name": "Pieology Pizzeria", "meal": "ランチ", "menu": "カスタムピザ／カルツォーネ／プルコギ薄皮ピザ", "price": "$10〜20", "area": "Apotgan", "lat": 13.492, "lng": -144.802, "maps": "https://www.google.com/maps/search/?api=1&query=Pieology+Pizzeria+Guam", "official": "https://pieology.com/", "emoji": "🍕", "comment": "🍕 生地・ソース・具材を自分好みに組み合わせるカスタムピザが魅力。肉・野菜・チーズなど好みが違う家族でも、それぞれ好きなピザを作りやすい。", "image": "https://images.happycow.net/venues/1024/15/17/hcmp151717_1931630.jpeg"}, {"id": 14, "name": "Ben N' Yan's", "meal": "ランチ", "menu": "オックステール・カレカレ／クリスピーポーク・シシグ／上海風ルンピア", "price": "$10〜20", "area": "Upper Tumon", "lat": 13.52, "lng": -144.8105, "maps": "https://www.google.com/maps/search/?api=1&query=Ben+N+Yans+Guam", "official": "", "emoji": "🍖", "comment": "🍖 フィリピン／グアム系の味を楽しみたい人向け。カレカレは肉と野菜を濃厚なピーナッツ系ソースで煮込む料理、シシグは細かい肉を香ばしく炒めたご飯が進む系。ルンピアはパリッとした春巻きでシェアしやすい。", "image": ""}, {"id": 15, "name": "Manang Pika（Tumon）", "meal": "ランチ", "menu": "ビリアタコス／フィッシュタコス（マンゴーサルサ）／シシグタコス／チュロス", "price": "$10〜20", "area": "Tumon", "lat": 13.514, "lng": -144.805, "maps": "https://www.google.com/maps/search/?api=1&query=Manang+Pika+Tumon+Guam", "official": "https://www.manangpika.com/", "emoji": "🌮", "comment": "🌮 フィリピン料理とメキシコ料理のフュージョン。ビリアタコスは煮込んだ肉の旨味をタコスで楽しむタイプ、シシグタコスは香ばしい豚肉系の具が主役。タコス＋チュロスでカジュアルランチに。", "image": "https://static.wixstatic.com/media/c43fd9_07879b542b5d467fa8d08cf7befa42c2~mv2.jpg/v1/fill/w_1000%2Ch_751%2Cal_c%2Cq_85%2Cusm_0.66_1.00_0.01/c43fd9_07879b542b5d467fa8d08cf7befa42c2~mv2.jpg"}, {"id": 16, "name": "Beachin Shrimp", "meal": "ランチ", "menu": "ビーチンシュリンプ／カリフォルニア・シュリンプ・ロール／エビフライバーガー", "price": "$14〜25", "area": "Tumon", "lat": 13.5145, "lng": -144.8052, "maps": "https://www.google.com/maps/search/?api=1&query=Beachin+Shrimp+Guam", "official": "https://www.beachinshrimp.com/", "emoji": "🍤", "comment": "🍤 エビを主役にしたシーフード店。Beachin Shrimpやココナッツシュリンプは、プリッとしたエビに香ばしい衣を合わせるタイプで、エビ好きには分かりやすいチョイス。シーフード好きの家族でシェアがおすすめ。", "image": ""}, {"id": 17, "name": "Lee Garden", "meal": "ランチ", "menu": "揚げ焼きそば／麻婆豆腐／天津飯／エビチリ", "price": "$8〜15", "area": "Tumon", "lat": 13.5148, "lng": -144.8058, "maps": "https://www.google.com/maps/search/?api=1&query=Lee+Garden+Guam", "official": "", "emoji": "🥢", "comment": "🥢 揚げ焼きそばは香ばしく焼いた麺に肉・エビ・野菜を合わせた食べ応えメニュー。麻婆豆腐やエビチリもご飯が進むので、複数品を注文して取り分ける食べ方と相性がいい。", "image": "https://deliverlogic-common-assets.s3.amazonaws.com/editable/images/goodtogo/menuitems/25498.png"}, {"id": 18, "name": "Three Squares Restaurant", "meal": "ランチ", "menu": "レッドライス／ティナラカトネ／フライドチキン／ビーフブリスケット", "price": "$10〜20", "area": "Tamuning", "lat": 13.487, "lng": -144.803, "maps": "https://www.google.com/maps/search/?api=1&query=Three+Squares+Restaurant+Guam", "official": "", "emoji": "🍚", "comment": "🍚 ローカルなチャモロ料理を試したい人におすすめ。レッドライスはアチョーテで色付けしたグアム定番のご飯。ティナラカトネなどの肉料理と合わせると、グアムらしいプレートランチ感を楽しめる。", "image": "https://assets.simpleviewinc.com/sv-guam/image/upload/c_fill%2Ch_600%2Cq_75%2Cw_800/v1/cms_resources/clients/guam/Three_Sqare3_8fdb753f-e09d-4464-99a1-153c6c64d03a.jpg"}, {"id": 19, "name": "San Jung", "meal": "ランチ", "menu": "キムチチゲ／キムチチャーハン／味付けカルビ／チーズタッカルビ／ビビンバ", "price": "$10〜20", "area": "Harmon", "lat": 13.5225, "lng": -144.822, "maps": "https://www.google.com/maps/search/?api=1&query=San+Jung+Guam", "official": "", "emoji": "🥘", "comment": "🥘 韓国料理店。キムチチゲは酸味と辛味のある熱々スープ、ビビンバはご飯＋野菜＋肉などを混ぜて食べる定番。味付けカルビやチーズタッカルビもあり、辛い料理好きなら候補。", "image": "https://media.triple.guide/triple-cms/c_limit%2Cf_auto%2Ch_1024%2Cw_1024/8f9ea044-1a60-465f-8dcf-28ae324478bc.jpeg"}, {"id": 20, "name": "Caliente Restaurant", "meal": "ランチ", "menu": "ステーキファヒータ／カリフォルニアブリトー／チキンファヒータ／エンチラーダ", "price": "$10〜20", "area": "Hagåtña", "lat": 13.4748, "lng": -144.7515, "maps": "https://www.google.com/maps/search/?api=1&query=Caliente+Restaurant+Guam", "official": "", "emoji": "🌮", "comment": "🌮 メキシカン系。ファヒータは焼いた肉と野菜をトルティーヤなどと合わせて食べるスタイルで、香ばしさとスパイス感を楽しめる。ブリトーやエンチラーダもあり、ボリューム重視のランチに。", "image": ""}, {"id": 21, "name": "Chili's Grill & Bar", "meal": "ディナー", "menu": "「3 For Me」セット／ケサディーヤ／マルガリータグリルドチキン／ベビーバックリブ", "price": "$10〜30", "area": "Tumon", "lat": 13.513, "lng": -144.806, "maps": "https://www.google.com/maps/search/?api=1&query=Chili%27s+Guam", "official": "https://www.chilis.com/", "emoji": "🍖", "comment": "🔥 アメリカン・テックスメックス系。ベビーバックリブは骨付きポークを甘辛いBBQソースで仕上げた肉料理で写真映えも◎。ケサディーヤなどシェアしやすい料理もあり、家族で取り分けるのがおすすめ。", "image": "https://assets.simpleviewinc.com/sv-guam/image/fetch/c_limit%2Cq_75%2Cw_830/https%3A/assets.simpleviewinc.com/simpleview/image/upload/crm/guam/TEXAS-SIZE-RIBS_A644AA3D-5056-A36A-0C6118FFF1F79EC2-a644a9805056a36_a644aaa4-5056-a36a-0cd16a6b84e6dd67.jpg"}, {"id": 22, "name": "Jamaican Grill", "meal": "ディナー", "menu": "バリュープラッター（リブ＋チキン）／ジャークチキン／ジャークバーガー／BBQリブ", "price": "$10〜20", "area": "Tamuning", "lat": 13.503, "lng": -144.8005, "maps": "https://www.google.com/maps/search/?api=1&query=Jamaican+Grill+Guam", "official": "https://jamaicangrill.com/", "emoji": "🔥", "comment": "🔥 ジャークチキンやリブなど、スパイスとBBQ感のある肉料理が主役。バリュープラッターならリブ＋チキンをまとめて食べられ、豪快な肉プレートを楽しみたい日にぴったり。", "image": "https://www.airial.travel/_next/image?q=70&url=https%3A%2F%2Fmedia-cdn.tripadvisor.com%2Fmedia%2Fphoto-w%2F24%2Fe4%2F8b%2F99%2Fthe-triple-combo-ribs.jpg&w=3840"}, {"id": 23, "name": "Mosa's Joint", "meal": "ディナー", "menu": "Spinach, Mushroom & Bleu Cheese Burger／ルーベンサンド／アボカドポキ", "price": "$10〜20", "area": "Hagåtña", "lat": 13.4748, "lng": -144.75, "maps": "https://www.google.com/maps/search/?api=1&query=Mosa%27s+Joint+Guam", "official": "", "emoji": "🍔", "comment": "🍔 カジュアルなバーガー店。Spinach, Mushroom & Bleu Cheese Burgerはほうれん草・きのこ・ブルーチーズの風味が加わる大人向けバーガー。チェーン系とは違うバーガーを食べたい日におすすめ。", "image": "https://cdn-ak.f.st-hatena.com/images/fotolife/k/kokawauso/20190930/20190930220647.jpg"}, {"id": 24, "name": "PROA Restaurant", "meal": "ディナー", "menu": "チャモロスタイルBBQ（ショートリブ・スペアリブ＋ライス＋サラダ）", "price": "BBQ $21〜25／メイン $23〜33", "area": "Tumon", "lat": 13.512, "lng": -144.805, "maps": "https://www.google.com/maps/search/?api=1&query=PROA+Restaurant+Guam", "official": "https://www.proaguam.com/", "emoji": "🔥", "comment": "🔥 グアムでチャモロBBQを狙うなら有力候補。ショートリブやスペアリブなどを香ばしく焼き、レッドライスやサラダと合わせる豪快なプレート。ディナーの本命候補に。", "image": "https://livedoor.blogimg.jp/drkgw2012-gourmet_travelogue/imgs/f/6/f6b09cfa-s.jpg"}, {"id": 25, "name": "California Pizza Kitchen", "meal": "ディナー", "menu": "ハワイアンBBQチキンピザ／クリスピーピザ／パスタ", "price": "$15〜25", "area": "Tumon", "lat": 13.5142, "lng": -144.8052, "maps": "https://www.google.com/maps/search/?api=1&query=California+Pizza+Kitchen+Guam", "official": "https://www.cpk.com/", "emoji": "🍕", "comment": "🍕 ハワイアンBBQチキンピザはBBQソースの甘辛さにチキン、チーズ、パイナップルなどを合わせた人気系ピザ。甘じょっぱい味が好きならおすすめ。家族でシェアしやすい。", "image": "https://scotscoop.com/wp-content/uploads/2013/12/IMG_0103.jpg"}, {"id": 26, "name": "Ban Thai", "meal": "ディナー", "menu": "トムヤムクン／グリーンカレー／マッサマンカレー／Ban Thai Sampler", "price": "$12〜22", "area": "Tamuning", "lat": 13.5045, "lng": -144.801, "maps": "https://www.google.com/maps/search/?api=1&query=Ban+Thai+Guam", "official": "https://www.banthaiguam.com/", "emoji": "🍲", "comment": "🍲 トムヤムクンはエビの旨味に酸味・辛味・ハーブの香りを重ねたタイ料理の代表格。グリーンカレーやマッサマンカレーはココナッツのまろやかさがあり、辛さが苦手な人にも比較的選びやすい。", "image": "https://assets.simpleviewinc.com/simpleview/image/fetch/c_limit%2Cq_75%2Cw_830/https%3A/assets.simpleviewinc.com/simpleview/image/upload/crm/guam/f6_683570ED-5056-A36A-0CCA36DA8D895F93-68356f2c5056a36_6835790e-5056-a36a-0c9120f8ba5dff9c.jpg"}, {"id": 27, "name": "TGI Friday's", "meal": "ディナー", "menu": "フライデー ウイスキー グレイズ リブ／ハンバーガー／ステーキ／サンドウィッチ", "price": "$15〜28", "area": "Tamuning", "lat": 13.506, "lng": -144.802, "maps": "https://www.google.com/maps/search/?api=1&query=TGI+Fridays+Guam", "official": "https://www.tgifridays.com/", "emoji": "🍖", "comment": "🍖 アメリカンな肉料理をがっつり食べたい日に。Whiskey Glaze系のリブは甘辛いグレーズを絡めた骨付き肉で、フライドポテトなどと合わせるとかなりボリューム満点。", "image": "https://d34coi8mdyihzd.cloudfront.net/images/WHAT%27S-ON-19/Fridays-Signature-Glaze-62/MOBILE-90/fsg-header-540"}, {"id": 28, "name": "メスクラ チャモロ フュージョン ビストロ", "meal": "ディナー", "menu": "ケラグエン／ティナクタック／創作ハンバーガー・パスタ／日曜限定ブランチ", "price": "$15〜30", "area": "Hagåtña", "lat": 13.476, "lng": -144.75, "maps": "https://www.google.com/maps/search/?api=1&query=Meskla+Chamorro+Fusion+Bistro+Guam", "official": "https://mesklaguam.com/", "emoji": "🇬🇺", "comment": "🇬🇺 現代的なチャモロ料理を食べたいなら注目。ケラグエンは肉や魚介を柑橘・唐辛子などで和えるチャモロ料理、ティナクタックは肉と野菜をココナッツ系の味で煮込む郷土料理。グアムらしさ優先ならかなりおすすめ。", "image": ""}];
L.map('map',{zoomControl:true,attributionControl:true}).setView([13.50,-144.79],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const markers=new Map(); const layer=L.layerGroup().addTo(map);
const card=document.getElementById('card'), list=document.getElementById('list'), search=document.getElementById('search');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function comment(d){
 if(d.name.includes('PROA')) return '🌟 グアムらしいチャモロ料理をしっかり食べたい日に。人気店なのでディナーは予約がおすすめ。';
 if(d.name.includes('Meskla')) return '🌴 ローカル感のあるグアム料理を狙うなら候補。家族でシェアしやすい料理も。';
 if(d.name.includes('Beachin')) return '🍤 エビ好きなら要チェック。タモン中心からも行きやすい。';
 if(d.name.includes('Kracked')) return '🌅 朝からしっかり食べたい日に。';
 if(d.name.includes('Jollibee')) return '👨‍👩‍👧‍👦 子連れでも選びやすい人気ファストフード。';
 return '🌺 グアム旅行中に気になる料理をチェックして、行きたい店を決めよう。';
}
function show(i,pan=true){
 const d=DATA[i];
 const photo=d.image ? '<div class="photoWrap"><img class="foodphoto" src="'+d.image+'" alt="'+esc(d.name)+' おすすめ料理" loading="lazy" onerror="this.parentElement.classList.add(\'photoError\');this.remove()"><div class="photoCaption">料理写真</div></div>' : '<div class="hero">'+d.emoji+'</div>';
 card.innerHTML=photo+'<div class="body"><span class="pill">'+esc(d.meal)+'</span><div class="name">'+esc(d.name)+'</div><div class="menu"><b>🍴 おすすめ：</b>'+esc(d.menu)+'</div><div class="price">💰 '+esc(d.price)+'</div><div class="area">📍 '+esc(d.area)+'</div><div class="comment"><b>💡 どんな料理？</b><br>'+esc(d.comment)+'</div><div class="actions">'+(d.official?'<a class="site" href="'+d.official+'" target="_blank" rel="noopener">🌐 公式サイト</a>':'')+'<a class="maps" href="'+d.maps+'" target="_blank" rel="noopener">📍 Google Maps</a></div></div>';
 if(pan){map.setView([d.lat,d.lng],14,{animate:true});}
}
function render(){
 const f=document.querySelector('.filters button.active').dataset.filter;
 const q=search.value.trim().toLowerCase();
 layer.clearLayers(); markers.clear(); list.innerHTML='';
 DATA.forEach((d,i)=>{
   const hit=(f==='all'||d.meal===f) && (!q || (d.name+' '+d.menu+' '+d.area).toLowerCase().includes(q));
   if(!hit) return;
   const marker=L.marker([d.lat,d.lng]).addTo(layer);
   marker.bindTooltip((i+1)+' '+d.name,{direction:'top',offset:[0,-8]});
   marker.bindPopup('<b>'+esc(d.emoji+' '+d.name)+'</b><br>'+esc(d.meal)+'<br>'+esc(d.price));
   marker.on('click',()=>show(i,false));
   markers.set(i,marker);
   const b=document.createElement('button'); b.className='item';
   b.innerHTML='<b>'+d.emoji+' '+esc(d.name)+'</b><span>'+esc(d.meal)+'　'+esc(d.price)+'　• '+esc(d.area)+'</span>';
   b.onclick=()=>{show(i,true); marker.openPopup();};
   list.appendChild(b);
 });
 if(!q && f==='all'){map.setView([13.50,-144.79],12);}
}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
 b.classList.add('active'); render();
});
search.addEventListener('input',render);
render(); show(0,false);
</script>
